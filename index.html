<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גילעד רחמים אביעד</title>
<meta name="description" content="גילעד רחמים אביעד – מוהל מוסמך, תורה ושיעורים.">
<meta property="og:title" content="גילעד רחמים אביעד">
<meta property="og:image" content="https://gilad-rachamim.github.io/mohel/gilad.jpg">
<meta name="theme-color" content="#16130f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16130f;--gold:#c9a55c;--gold-soft:#8a7444;--parchment:#efe6d2;--muted:#a99c82}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Assistant",system-ui,sans-serif;color:var(--parchment);
    background:radial-gradient(120% 60% at 85% 0%,rgba(201,165,92,.10),transparent 60%),var(--ink);
    min-height:100vh;display:grid;place-items:center;padding:3rem 1.25rem;line-height:1.6;
  }
  main{width:100%;max-width:30rem;text-align:center}
  img{width:7.5rem;height:7.5rem;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin-bottom:1.5rem}
  h1{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:clamp(2rem,8vw,2.8rem);color:#fbf5e7;line-height:1.2}
  .tag{color:var(--muted);margin-top:.4rem}
  nav{display:grid;gap:.9rem;margin-top:2.25rem;text-align:right}
  .door{
    display:block;padding:1.1rem 1.25rem;border:1px solid rgba(201,165,92,.4);border-radius:14px;
    text-decoration:none;color:inherit;transition:border-color .2s,background .2s;
  }
  a.door:hover{border-color:var(--gold);background:rgba(201,165,92,.07)}
  a.door:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .door strong{display:block;font-family:"Frank Ruhl Libre",serif;font-weight:500;font-size:1.35rem;color:var(--gold)}
  .door span{color:var(--muted)}
  .door.soon{opacity:.55;border-style:dashed}
  @media (prefers-reduced-motion:reduce){.door{transition:none}}
</style>
</head>
<body>
<main>
  <img src="mohel/gilad.jpg" alt="גילעד רחמים אביעד" width="600" height="600">
  <h1>גילעד רחמים אביעד</h1>
  <p class="tag">ירושלים</p>
  <nav aria-label="האתרים שלי">
    <a class="door" href="mohel/">
      <strong>ברית מילה</strong>
      <span>מוהל מוסמך – ברית מכל הלב והנשמה</span>
    </a>
    <div class="door soon" aria-disabled="true">
      <strong>תורה ושיעורים</strong>
      <span>בקרוב, בעזרת ה'</span>
    </div>
  </nav>
</main>
</body>
</html>
