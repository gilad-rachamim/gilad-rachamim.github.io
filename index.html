<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גילעד רחמים אביעד</title>
<meta name="description" content="גילעד רחמים אביעד – מוהל מוסמך. ברית מכל הלב והנשמה, ומדריך חינם להורים לקראת הולדת הבן.">
<link rel="canonical" href="https://gilad-rachamim.github.io/">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="גילעד רחמים אביעד">
<meta property="og:description" content="מוהל מוסמך · ברית מכל הלב והנשמה">
<meta property="og:image" content="https://gilad-rachamim.github.io/assets/og-mohel.jpg">
<meta name="theme-color" content="#16130f">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  body{display:grid;place-items:center;padding:3rem 1.25rem}
  main{width:100%;max-width:30rem;text-align:center}
  .me{width:7.5rem;height:7.5rem;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin:0 auto 1.5rem}
  h1{font-weight:700;font-size:clamp(2rem,8vw,2.8rem);color:var(--cream)}
  .tag{color:var(--muted);margin-top:.4rem}
  nav{display:grid;gap:.9rem;margin-top:2.25rem;text-align:right}
  .door{display:block;padding:1.1rem 1.25rem;border:1px solid rgba(201,165,92,.4);border-radius:14px;text-decoration:none;color:inherit;transition:border-color .2s,background .2s}
  a.door:hover{border-color:var(--gold);background:rgba(201,165,92,.07)}
  .door strong{display:block;font-family:var(--serif);font-weight:500;font-size:1.35rem;color:var(--gold)}
  .door span{color:var(--muted)}
  .door.soon{opacity:.55;border-style:dashed}
</style>
</head>
<body>
<main>
  <img class="me" src="mohel/gilad.jpg" alt="גילעד רחמים אביעד" width="600" height="600">
  <h1>גילעד רחמים אביעד</h1>
  <p class="tag">ירושלים</p>
  <nav aria-label="האתרים שלי">
    <a class="door" href="mohel/">
      <strong>ברית מילה</strong>
      <span>מוהל מוסמך – ברית מכל הלב והנשמה</span>
    </a>
    <a class="door" href="mohel/madrich/">
      <strong>מדריך חינם להורים</strong>
      <span>ההכנה המושלמת לקראת הולדת הבן</span>
    </a>
    <div class="door soon" aria-disabled="true">
      <strong>תורה ושיעורים</strong>
      <span>בקרוב, בעזרת ה'</span>
    </div>
  </nav>
</main>
</body>
</html>
