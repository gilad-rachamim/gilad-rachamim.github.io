# חדרים חיים למשחקי הקלפים (רביעיות, יניב, אבני מספרים, פוקר) – Cloudflare Worker + Durable Object (חינמי).
# מחובר ל-assets/chashiva-cards.js. השרת רק מעביר הודעות בתוך חדר; המשחק עצמו רץ בטלפון של מי שפתח את החדר.
# פריסה (רק אחרי אישור של גילעד): cd tools/chashiva-live-worker && npx wrangler deploy
# בדיקה מקומית:                      npx wrangler dev --local --port 8790
name = "chashiva-live"
main = "chashiva-live-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
EXTRA_ORIGINS = ""
