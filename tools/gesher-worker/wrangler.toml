# גשר טלפון↔מחשב – ממסר עיוור (Cloudflare Worker + Durable Object, חינמי).
# מעביר מסגרות מוצפנות בין הטלפון למחשב של אותו צימוד. לא פותח אותן, לא שומר אותן, לא כותב אותן ללוג.
# פריסה (רק אחרי "כן" של גילעד): cd tools/gesher-worker && npx wrangler deploy
# בדיקה מקומית:                   npx wrangler dev --local --port 8797   ואז  node tools/check_gesher_worker.js http://127.0.0.1:8797
name = "kelim-gesher"
main = "gesher-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
