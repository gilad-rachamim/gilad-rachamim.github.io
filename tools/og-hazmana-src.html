<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(120% 80% at 85% 0%,rgba(201,165,92,.22),transparent 60%),#16130f;position:relative;font-family:var(--sans)}
.txt{position:absolute;right:70px;top:0;height:630px;width:600px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.k{font-family:var(--serif);color:var(--gold);font-size:30px;letter-spacing:.02em}
h1{font-family:var(--serif);color:#fbf5e7;font-size:74px;line-height:1.1;font-weight:700;margin:0}
.free{display:inline-block;background:var(--gold);color:#16130f;font-weight:800;font-size:40px;border-radius:999px;padding:4px 30px;margin-top:6px;align-self:flex-start}
.sub{color:#d9cfbb;font-size:28px;line-height:1.5;margin:0}
.who{color:#a99c82;font-size:24px;margin-top:10px}
.img{position:absolute;left:60px;top:-10px;width:470px;transform:rotate(-4deg);border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.6);border:1px solid rgba(201,165,92,.4)}
</style>
</head>
<body>
<!-- og-card.png = צילום של #hz-guest-canvas בעיצוב זהב (approval-pack shots עם selector). מצלמים את הדף הזה ב-1200x630 ושומרים כ-assets/og-hazmana.jpg -->
<img class="img" src="/og-card.png" alt="">
<div class="txt">
  <div class="k">בס"ד · מתנה להורים</div>
  <h1>הודעה מעוצבת לברית מילה</h1>
  <span class="free">בחינם, תוך דקה</span>
  <p class="sub">ממלאים מתי ואיפה, בוחרים עיצוב, ושולחים בוואטסאפ. עם ניווט, יומן ואישורי הגעה.</p>
  <div class="who">גילעד רחמים אביעד · מוהל מוסמך · ירושלים</div>
</div>
</body>
</html>
