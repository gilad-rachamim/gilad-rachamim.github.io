<!doctype html>
<html dir="rtl" lang="he" class="hk-paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תרגום PDF – הכלים של גילעד רחמים</title>
<link rel="icon" href="icon32.png">
<link rel="stylesheet" href="translate.css">
<style>
  :root { color-scheme: light dark; --bg: #f6f2ea; --paper: #fff; --ink: #1d1a16; --muted: #6b6255; --gold: #b8892f; --line: #e3d9c6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12100d; --paper: #1c1915; --ink: #f1e9da; --muted: #b3a892; --gold: #d9b25f; --line: #3a3226; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.7 "Segoe UI", Arial, sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--paper); border-bottom: 2px solid var(--gold); }
  .top b { flex: 1; min-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top a, .top button { font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; cursor: pointer; text-decoration: none; }
  .top a:hover, .top button:hover { border-color: var(--gold); }
  .top a:focus-visible, .top button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  main { max-width: 820px; margin: 18px auto 120px; padding: 0 16px; }
  .page { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 22px 28px; margin: 0 0 16px; }
  .pno { color: var(--muted); font-size: 15px; margin: 0 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .page p { margin: 0 0 .8em; text-align: start; }
  .page h3 { margin: .6em 0 .4em; font-size: 1.2em; line-height: 1.4; }
  .msg { background: var(--paper); border: 2px solid var(--gold); border-radius: 12px; padding: 16px 18px; }
  .msg button, .msg label.pick { font: inherit; font-size: 15px; background: var(--gold); color: #141210; border: 0; border-radius: 9px; padding: 7px 14px; cursor: pointer; font-weight: 700; display: inline-block; margin: 6px 0 0 6px; }
  .drop { outline: 3px dashed var(--gold); outline-offset: -10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 600px) { .page { padding: 16px; } }
  @media print { .top { display: none; } body { background: #fff; } .page { border: 0; padding: 0; break-after: page; } }
</style>
<link rel="stylesheet" href="a11y.css">
<script src="a11y.js"></script>
</head>
<body>
<div class="top" translate="no" role="banner">
  <img src="icon32.png" alt="" width="22" height="22">
  <b id="name" role="heading" aria-level="1">PDF</b>
  <a id="orig" href="#" target="_blank" hidden>📄 ה-PDF המקורי</a>
  <button type="button" id="print">🖨 להדפיס / לשמור את התרגום</button>
</div>
<main id="doc">
  <div class="msg" id="msg" translate="no" role="status">טוען את ה-PDF…</div>
</main>
<script src="pdf.min.js"></script>
<script src="translate.js"></script>
<script src="pdf-view.js"></script>
</body>
</html>
