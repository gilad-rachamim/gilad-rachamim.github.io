<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<title>הכלים של גילעד רחמים</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><img src="icon32.png" alt="" width="24" height="24"><b>הכלים של גילעד רחמים</b></header>

<section id="pdf" hidden aria-labelledby="pdf-h">
  <h2 id="pdf-h">ה-PDF הפתוח</h2>
  <button class="gold" type="button" data-tool="chatima">✍ למלא ולחתום</button>
  <div class="row">
    <button class="line" type="button" data-tool="pdf">🗜 לכווץ</button>
    <button class="line" type="button" data-tool="fax">📠 לשלוח כפקס</button>
  </div>
  <p class="msg" id="pdf-msg" role="status"></p>
</section>

<section id="qr" hidden aria-labelledby="qr-h">
  <h2 id="qr-h">קוד QR לדף הזה</h2>
  <div id="qr-box" class="qr-box" role="img" aria-label="קוד QR של הדף הפתוח"></div>
  <p class="small" id="qr-title"></p>
  <div class="row">
    <button class="line" type="button" id="qr-dl">⬇ להוריד כתמונה</button>
    <button class="line" type="button" id="qr-copy">🔗 להעתיק קישור</button>
  </div>
</section>

<section aria-labelledby="pw-h">
  <h2 id="pw-h">סיסמה חזקה</h2>
  <div class="pw"><code id="pw-out" dir="ltr" aria-live="polite">לחצו ליצירה</code></div>
  <div class="row">
    <button class="line" type="button" id="pw-new">🔑 סיסמה חדשה</button>
    <button class="line" type="button" id="pw-copy" disabled>להעתיק</button>
  </div>
  <p class="small">נוצרת כאן, במחשב שלכם. טיפ: לחיצה ימנית בשדה סיסמה באתר ← "להכניס סיסמה חזקה".</p>
</section>

<nav aria-label="כלים באתר">
  <h2>עוד כלים בחינם</h2>
  <a href="https://hakelim.com/kelim/machshev/chatima/" target="_blank">✍ חתימה על PDF</a>
  <a href="https://hakelim.com/kelim/machshev/tmuna/" target="_blank">📷 הקטנת תמונה</a>
  <a href="https://hakelim.com/kelim/machshev/pdf/" target="_blank">🗜 כיווץ PDF</a>
  <a href="https://hakelim.com/kelim/machshev/fax/" target="_blank">📠 פקס בלי פקס</a>
  <a href="https://hakelim.com/kelim/machshev/sisma/" target="_blank">🔑 בודק סיסמה</a>
  <a href="https://hakelim.com/kelim/" target="_blank" class="all">כל הכלים ←</a>
</nav>
<footer>שום קובץ לא עולה לשרת. <a href="https://hakelim.com/kelim/machshev/chatima/tosaf/" target="_blank">פרטיות</a></footer>
<script src="qrcode.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
