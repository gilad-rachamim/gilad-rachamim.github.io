# מוצאים קבוצה (/kelim/kehila/kvutzot-whatsapp/) – Cloudflare Worker + Durable Object אחד (חינמי). הרעיון באדיבות אהרן גרינברג.
# פריסה:        cd tools/kvutzot-worker && npx wrangler deploy   (אותו חשבון כמו kelim-bakasha)
# בדיקה מקומית: node test.mjs   (מדמה את האחסון, בלי wrangler)
# סודות (wrangler secret put): ADMIN_KEY (מפתח לוח הניהול של גילעד), HUB_SECRET (כמו ב-gilad-hub, להתראות לבוט הפרטי).
name = "kelim-kvutzot"
main = "kvutzot-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "Groups"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Groups"]

# התראות לגילעד יוצאות דרך ה-Worker הקיים gilad-hub (POST /pc/send), בלי שינוי בקוד שלו.
[[services]]
binding = "HUB"
service = "gilad-hub"

[triggers]
crons = ["30 3 * * *"]

[vars]
EXTRA_ORIGINS = ""
