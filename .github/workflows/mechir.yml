# פעם בשבוע: מחירי סופר חדשים לכלי /kesef/mechir/ (קבצי שקיפות המחירים של הרשתות, לפי חוק המזון).
# רץ ביום ראשון בבוקר, כשהרשתות כבר העלו את הקבצים של אותו יום. אפשר גם ידנית (Run workflow).
name: mechir-data
on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/super_prices.py
      - name: commit if changed
        run: |
          git diff --quiet kesef/mechir.json && { echo "אין שינוי"; exit 0; }
          git config user.name "mechir-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kesef/mechir.json
          git commit -m "מחירי סופר שבועיים לכלי כמה הגיוני לשלם"
          git pull --rebase
          git push
