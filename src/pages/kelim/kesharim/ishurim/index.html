<header class="k-hero">
  <h1>אישורי הגעה</h1>
  <p class="sub">לאירוע קטן – ברית, בר מצווה, ערב חברים או שבת חתן. רשימה אחת: מי מגיע, כמה נפשות, ומי עוד לא ענה.</p>
</header>
<div class="tool">
  <form class="k-form" id="is-form" novalidate>
    <div class="field"><label for="is-event">איזה אירוע?</label><input id="is-event" name="event" type="text" maxlength="60" placeholder="שבת חתן של יוסי, 21.11"></div>
    <div class="field"><label for="is-names">להוסיף מוזמנים <span class="opt">(שם בכל שורה, אפשר להדביק רשימה)</span></label><textarea id="is-names" maxlength="3000" placeholder="משפחת כהן&#10;דני ורותי&#10;סבא וסבתא"></textarea></div>
    <button class="btn btn-gold btn-block" type="submit">להוסיף לרשימה</button>
  </form>
  <div class="is-sum"><div><b id="is-yes">0</b><span>נפשות מגיעות</span></div><div><b id="is-no">0</b><span>לא מגיעים</span></div><div><b id="is-wait">0</b><span>עוד לא ענו</span></div></div>
  <ul class="is-list" id="is-list"></ul>
  <div class="share-row">
    <a class="btn btn-gold btn-sm" href="#" id="is-remind" target="_blank" rel="noopener"><svg class="ic"><use href="#wa"/></svg> הודעת תזכורת למי שלא ענה</a>
    <a class="btn btn-line btn-sm" href="#" id="is-wa" target="_blank" rel="noopener">לשלוח סיכום</a>
    <button class="btn btn-line btn-sm" type="button" id="is-clear">אירוע חדש (לנקות)</button>
  </div>
  <p class="disclaimer">ההודעה נפתחת בווטסאפ, ושם בוחרים למי לשלוח. הרשימה נשמרת רק בטלפון הזה.</p>
  <div class="share-row"><a class="btn btn-line btn-sm" href="#" data-share-tool="wa" data-text="אישורי הגעה לאירוע קטן בטלפון: מי מגיע, כמה נפשות ומי לא ענה. בחינם:" target="_blank" rel="noopener"><svg class="ic"><use href="#wa"/></svg> לשלוח את הכלי לחבר</a></div>
</div>
