<header class="k-hero no-print">
  <h1>תכנון שבת</h1>
  <p class="sub">תפריט, אורחים ומי מביא מה, בדף אחד. שולחים לכל המשפחה, ואף אחד לא שואל שוב "מה להביא?".</p>
</header>
<div class="tool no-print">
  <form class="k-form" id="sp-form" novalidate>
    <div class="field"><label for="sp-title">איזו שבת?</label><input id="sp-title" name="title" type="text" maxlength="50" placeholder="שבת פרשת וישלח, אצל סבא וסבתא"></div>
    <div class="field"><label for="sp-guests">מי מגיע?</label><input id="sp-guests" name="guests" type="text" maxlength="120" placeholder="משפחת כהן (5), דודה מירי, רבקה וחיים"></div>
    <div class="field"><label for="sp-m1">ליל שבת</label><textarea id="sp-m1" name="m1" maxlength="500" placeholder="חלות, דגים, מרק עוף, עוף בתנור, אורז, סלטים, עוגה"></textarea></div>
    <div class="field"><label for="sp-m2">סעודת שבת בבוקר</label><textarea id="sp-m2" name="m2" maxlength="500" placeholder="חמין, קוגל, סלטים, פירות"></textarea></div>
    <div class="field"><label for="sp-m3">סעודה שלישית</label><textarea id="sp-m3" name="m3" maxlength="300" placeholder="לחמניות, ביצים, סלט טונה"></textarea></div>
    <div class="field"><span class="label">מי מביא ועושה מה</span>
      <div id="sp-tasks"></div>
      <button class="btn btn-line btn-sm" type="button" id="sp-addt">+ עוד משימה</button>
    </div>
  </form>
  <div class="share-row">
    <a class="btn btn-gold btn-sm" href="#" id="sp-wa" target="_blank" rel="noopener"><svg class="ic"><use href="#wa"/></svg> לשלוח למשפחה</a>
    <button class="btn btn-line btn-sm" type="button" id="sp-print">להדפיס למקרר</button>
    <button class="btn btn-line btn-sm" type="button" id="sp-new">לשבת הבאה (לנקות)</button>
  </div>
  <p class="disclaimer">זמני הדלקת נרות וצאת השבת לפי המיקום שלכם: <a class="gold" href="/kodesh/zmanim/">זמני שבת</a>. הכול נשמר רק בטלפון הזה.</p>
</div>
<div id="sp-card" class="mp-card"></div>
<div class="tool no-print"><div class="share-row"><a class="btn btn-line btn-sm" href="#" data-share-tool="wa" data-text="מתכננים שבת בדף אחד: תפריט, אורחים ומי מביא מה. בחינם:" target="_blank" rel="noopener"><svg class="ic"><use href="#wa"/></svg> לשלוח את הכלי לחבר</a></div></div>
