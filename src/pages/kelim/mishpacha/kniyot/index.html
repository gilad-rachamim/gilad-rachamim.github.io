<header class="k-hero">
  <h1>רשימת קניות</h1>
  <p class="sub">מוסיפים בלחיצה, מסמנים מה כבר בעגלה, ושולחים את מה שחסר. הרשימה נשמרת בטלפון.</p>

<div class="tool">
  <div class="k-form">
    <form class="mp-add" id="kn-add"><input id="kn-new" type="text" maxlength="50" placeholder="מה צריך? (למשל: 2 חלב)" aria-label="מוצר חדש" enterkeyhint="done"><button class="btn btn-gold btn-sm" type="submit">להוסיף</button></form>

  <div id="kn-list" style="margin-top:1rem"></div>

    <button class="btn btn-line btn-sm" type="button" id="kn-copy">להעתיק</button>
    <button class="btn btn-line btn-sm" type="button" id="kn-clean">למחוק את מה שנקנה</button>
    <button class="btn btn-line btn-sm" type="button" id="kn-all">לנקות הכול</button>
  </div>
  <p class="disclaimer">הרשימה נשמרת רק בטלפון הזה. כדי שגם בן או בת הזוג יראו – שולחים בווטסאפ.</p>
