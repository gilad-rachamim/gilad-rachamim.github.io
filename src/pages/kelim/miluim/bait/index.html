<header class="k-hero no-print">
  <h1>דף לבית</h1>
  <p class="sub">לפני שיוצאים: כל מה שהמשפחה צריכה לדעת, בדף אחד. ממלאים פעם אחת, מדפיסים למקרר או שולחים בווטסאפ.</p>
</header>
<div class="tool no-print">
  <form class="k-form" id="bt-form" novalidate>
    <div class="field"><label for="bt-name">מי יוצא?</label><input id="bt-name" name="name" type="text" maxlength="40" placeholder="אבא / יוסי"></div>
    <div class="field"><label for="bt-dates">עד מתי בערך? <span class="opt">(לא חובה)</span></label><input id="bt-dates" name="dates" type="text" maxlength="40" placeholder="עד סוף החודש, יעודכן"></div>
    <div class="field"><span class="label">אנשי קשר</span>
      <div id="bt-contacts"></div>
      <button class="btn btn-line btn-sm" type="button" id="bt-addc">+ עוד איש קשר</button>
    </div>
    <div class="field"><label for="bt-kids">מי אוסף ומי מסיע <span class="opt">(ילדים, חוגים, הסעות)</span></label><textarea id="bt-kids" name="kids" maxlength="600" placeholder="ראשון ורביעי: סבתא אוספת מהגן&#10;שלישי: חוג כדורגל, אבא של דני מסיע"></textarea></div>
    <div class="field"><label for="bt-pay">תשלומים ודברים לזכור</label><textarea id="bt-pay" name="pay" maxlength="600" placeholder="ארנונה יורדת ב-10 לחודש&#10;טסט לרכב בשבוע הבא&#10;תור לרופא שיניים ביום שלישי"></textarea></div>
    <p class="note">בלי סיסמאות וקודים בדף הזה: הוא נתלה על המקרר ונשלח בווטסאפ.</p>
  </form>
  <div class="share-row">
    <button class="btn btn-gold btn-sm" type="button" id="bt-print">להדפיס למקרר</button>
    <a class="btn btn-line btn-sm" href="#" id="bt-wa" target="_blank" rel="noopener"><svg class="ic"><use href="#wa"/></svg> לשלוח כטקסט</a>
    <button class="btn btn-line btn-sm" type="button" id="bt-img">לשמור כתמונה</button>
  </div>
</div>
<div id="bt-card" class="bt-card"></div>
