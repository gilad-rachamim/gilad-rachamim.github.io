<header class="k-hero">
  <h1>בודק Regex</h1>
  <p class="sub">כותבים תבנית, ורואים מיד מה היא תופסת בטקסט. עם תבניות מוכנות לטלפון ישראלי, אימייל, תאריך ועברית.</p>
</header>
<div class="tool">
  <div class="field"><label for="rx-ready">תבנית מוכנה</label><select id="rx-ready"><option value="">לבחור תבנית…</option></select></div>
  <label class="tn-lab" for="rx-p">התבנית</label>
  <input id="rx-p" class="tn-code" dir="ltr" style="unicode-bidi:normal;text-align:left" type="text" spellcheck="false" autocomplete="off">
  <div class="rx-flags" id="rx-flags">
    <label><input type="checkbox" id="rx-fg"> g כל ההתאמות</label>
    <label><input type="checkbox" id="rx-fi"> i בלי הבדל אותיות</label>
    <label><input type="checkbox" id="rx-fm"> m כל שורה</label>
    <label><input type="checkbox" id="rx-fs"> s נקודה תופסת ירידת שורה</label>
    <label><input type="checkbox" id="rx-fu"> u יוניקוד</label>
  </div>
  <p class="rx-slash" id="rx-slash"></p>
  <label class="tn-lab" for="rx-t">הטקסט לבדיקה</label>
  <textarea id="rx-t" class="tn-code" spellcheck="false" dir="auto"></textarea>
  <p class="note" id="rx-msg" aria-live="polite"></p>
  <div class="tn-code rx-view" id="rx-view" dir="auto"></div>
  <ul class="rx-list" id="rx-list"></ul>
  <label class="tn-lab"><input type="checkbox" id="rx-rep"> גם להחליף</label>
  <div id="rx-rbox" hidden>
    <input id="rx-r" class="tn-code" type="text" spellcheck="false" aria-label="להחליף ב (אפשר $1, $2 לקבוצות)">
    <p class="note">אפשר להשתמש ב-$1, $2 לקבוצות שבסוגריים.</p>
    <div class="tn-code" id="rx-out" dir="auto"></div>
  </div>
  <div class="tn-btns">
    <button class="btn btn-gold btn-sm" type="button" id="rx-copy">להעתיק כקוד JavaScript</button>
    <button class="btn btn-line btn-sm" type="button" id="rx-reset">לחזור לדוגמה</button>
  </div>
